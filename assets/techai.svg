
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#182c4d"/>
      <stop offset="100%" stop-color="#090e1c"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4e5ff"/>
      <stop offset="45%" stop-color="#667da9"/>
      <stop offset="100%" stop-color="#293b5c"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#65e4ff"/>
      <stop offset="100%" stop-color="#a77bff"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <style>
      .float { animation: float 4s ease-in-out infinite; }
      .float2 { animation: float 4s ease-in-out 1.5s infinite; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      @keyframes float {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
      }
      @keyframes pulse {
        0%,100% { opacity:.55; }
        50% { opacity:1; }
      }
      .skill { font: 600 16px Arial, sans-serif; fill:#eaf3ff; }
      .small { font: 11px Arial, sans-serif; fill:#91a9ce; letter-spacing:1px; }
    </style>
  </defs>

  <!-- Ambient glow -->
  <ellipse cx="450" cy="425" rx="245" ry="35" fill="#6a70ff" opacity=".18" filter="url(#shadow)"/>

  <!-- Floating technology cards -->
  <g class="float">
    <rect x="65" y="95" width="190" height="65" rx="13" fill="#101b31" stroke="#48d9ee" stroke-opacity=".7"/>
    <circle cx="88" cy="127" r="6" fill="#48d9ee"/>
    <text x="105" y="124" class="skill">LangChain</text>
    <text x="105" y="142" class="small">AI FRAMEWORK</text>
  </g>

  <g class="float2">
    <rect x="650" y="75" width="190" height="65" rx="13" fill="#101b31" stroke="#a77bff" stroke-opacity=".8"/>
    <circle cx="674" cy="107" r="6" fill="#a77bff"/>
    <text x="691" y="104" class="skill">LangGraph</text>
    <text x="691" y="122" class="small">AGENT WORKFLOWS</text>
  </g>

  <g class="float2">
    <rect x="40" y="300" width="155" height="65" rx="13" fill="#101b31" stroke="#55c9a8" stroke-opacity=".8"/>
    <circle cx="63" cy="332" r="6" fill="#55c9a8"/>
    <text x="80" y="329" class="skill">LLMs</text>
    <text x="80" y="347" class="small">LANGUAGE MODELS</text>
  </g>

  <g class="float">
    <rect x="705" y="280" width="155" height="65" rx="13" fill="#101b31" stroke="#ffbd70" stroke-opacity=".8"/>
    <circle cx="728" cy="312" r="6" fill="#ffbd70"/>
    <text x="745" y="309" class="skill">CrewAI</text>
    <text x="745" y="327" class="small">MULTI-AGENT AI</text>
  </g>

  <g class="float">
    <rect x="165" y="420" width="155" height="60" rx="12" fill="#101b31" stroke="#a77bff" stroke-opacity=".8"/>
    <circle cx="188" cy="450" r="6" fill="#a77bff"/>
    <text x="205" y="447" class="skill">MCP</text>
    <text x="205" y="463" class="small">TOOL CONNECTIVITY</text>
  </g>

  <g class="float2">
    <rect x="585" y="420" width="190" height="60" rx="12" fill="#101b31" stroke="#48d9ee" stroke-opacity=".8"/>
    <circle cx="608" cy="450" r="6" fill="#48d9ee"/>
    <text x="625" y="447" class="skill">OpenAI SDK</text>
    <text x="625" y="463" class="small">AI DEVELOPMENT</text>
  </g>

  <!-- Connection lines -->
  <g fill="none" stroke="url(#glow)" stroke-width="1.5" opacity=".5" stroke-dasharray="5 7">
    <path d="M255 130 Q330 155 360 205"/>
    <path d="M650 115 Q575 150 540 205"/>
    <path d="M195 330 Q275 320 320 295"/>
    <path d="M705 310 Q625 320 580 295"/>
    <path d="M320 420 Q365 380 390 350"/>
    <path d="M585 420 Q540 380 510 350"/>
  </g>

  <!-- Laptop screen frame -->
  <g>
    <rect x="285" y="115" width="330" height="245" rx="17" fill="#111c30" stroke="url(#metal)" stroke-width="5"/>
    <rect x="298" y="128" width="304" height="218" rx="9" fill="url(#screen)"/>
    <circle cx="450" cy="121" r="2" fill="#91a9ce"/>

    <!-- Screen heading -->
    <text x="320" y="160" fill="#dceaff" font-size="13" font-family="Arial" font-weight="bold">AI DEVELOPMENT</text>
    <circle cx="565" cy="153" r="4" fill="#5be3b1" class="pulse"/>
    <text x="575" y="157" fill="#8ca7c9" font-size="9" font-family="Arial">ACTIVE</text>

    <!-- Code lines -->
    <g font-family="monospace" font-size="12">
      <text x="320" y="195" fill="#c792ea">from</text>
      <text x="354" y="195" fill="#8bd5ff"> langchain</text>
      <text x="430" y="195" fill="#c792ea">import</text>
      <text x="320" y="219" fill="#8bd5ff">ChatModel</text>
      <text x="320" y="250" fill="#c792ea">agent</text>
      <text x="365" y="250" fill="#e6b673">=</text>
      <text x="380" y="250" fill="#8bd5ff">LangGraph</text>
      <text x="320" y="281" fill="#7ee0c1">response</text>
      <text x="390" y="281" fill="#e6b673">=</text>
      <text x="405" y="281" fill="#8bd5ff">llm.invoke()</text>
    </g>
    <rect x="320" y="302" width="175" height="5" rx="2" fill="#293f60"/>
    <rect x="320" y="302" width="115" height="5" rx="2" fill="url(#glow)" class="pulse"/>
    <text x="320" y="329" fill="#7993b8" font-size="9" font-family="Arial">BUILDING INTELLIGENT SYSTEMS</text>

    <!-- Laptop base -->
    <path d="M265 365 L635 365 L670 390 Q672 398 655 400 L245 400 Q228 398 232 390 Z" fill="url(#metal)" stroke="#8ca9d1" stroke-width="1.5"/>
    <path d="M385 372 L515 372 L505 382 L395 382 Z" fill="#263c5e" opacity=".9"/>
    <path d="M245 390 L655 390" stroke="#d4e5ff" stroke-opacity=".4"/>
  </g>

  <!-- Small orbiting particles -->
  <g fill="url(#glow)" class="pulse">
    <circle cx="270" cy="220" r="3"/>
    <circle cx="630" cy="220" r="3"/>
    <circle cx="450" cy="85" r="4"/>
    <circle cx="450" cy="420" r="3"/>
  </g>
</svg>
