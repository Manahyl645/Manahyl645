
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="700" height="480">
<defs>
  <radialGradient id="space">
    <stop stop-color="#242044"/>
    <stop offset="1" stop-color="#080b14"/>
  </radialGradient>
  <radialGradient id="glass" cx="30%" cy="22%">
    <stop stop-color="#ffffff" stop-opacity=".3"/>
    <stop offset=".35" stop-color="#a88bff" stop-opacity=".12"/>
    <stop offset=".8" stop-color="#36256d" stop-opacity=".18"/>
    <stop offset="1" stop-color="#ff6685" stop-opacity=".25"/>
  </radialGradient>
  <radialGradient id="brain" cx="35%" cy="25%">
    <stop stop-color="#ffe0f0"/>
    <stop offset=".3" stop-color="#ff6685"/>
    <stop offset=".65" stop-color="#9b5de5"/>
    <stop offset="1" stop-color="#30205d"/>
  </radialGradient>
  <linearGradient id="metal">
    <stop stop-color="#ff6685"/>
    <stop offset=".5" stop-color="#d5b5ff"/>
    <stop offset="1" stop-color="#159e98"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="9" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="shadow">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
</defs>

<rect width="700" height="480" rx="25" fill="url(#space)"/>

<!-- Ambient light -->
<ellipse cx="350" cy="230" rx="180" ry="150"
 fill="#8067d8" opacity=".15" filter="url(#shadow)"/>

<!-- Holographic orbital rings -->
<g fill="none" stroke="url(#metal)">
 <ellipse cx="350" cy="220" rx="245" ry="82"
 transform="rotate(-24 350 220)" stroke-width="2.5"/>
 <ellipse cx="350" cy="220" rx="245" ry="82"
 transform="rotate(32 350 220)" stroke-width="2"/>
 <ellipse cx="350" cy="220" rx="180" ry="205"
 stroke-width="1.3" opacity=".5"/>
</g>

<!-- Glass sphere -->
<circle cx="350" cy="210" r="137"
 fill="url(#glass)" stroke="#c5aaff"
 stroke-opacity=".65" stroke-width="2"/>

<circle cx="350" cy="210" r="130"
 fill="none" stroke="#fff" stroke-opacity=".18"/>

<!-- Brain silhouette -->
<path d="M345 130
 C315 105 278 128 280 158
 C245 155 231 194 252 215
 C228 242 254 277 282 275
 C294 310 331 310 350 288
 C371 311 408 298 414 270
 C450 263 455 226 433 207
 C450 176 425 145 398 150
 C390 118 361 113 345 130Z"
 fill="url(#brain)" stroke="#ffc4e1"
 stroke-width="2" filter="url(#glow)"/>

<!-- Brain folds -->
<g fill="none" stroke="#ffe3f1" stroke-width="3"
 stroke-linecap="round" opacity=".8">
 <path d="M344 137 Q317 145 325 170 Q305 183 321 203"/>
 <path d="M289 165 Q310 170 305 193 Q284 210 306 228"/>
 <path d="M270 215 Q300 212 300 242 Q317 258 310 278"/>
 <path d="M355 135 Q376 151 360 174 Q378 190 356 208"/>
 <path d="M396 157 Q373 172 393 194 Q417 208 393 225"/>
 <path d="M420 216 Q397 228 408 248 Q389 265 390 276"/>
 <path d="M342 216 Q322 239 342 255 Q326 276 350 289"/>
 <path d="M364 215 Q383 230 369 249"/>
</g>

<!-- Neural nodes -->
<g fill="#fff" filter="url(#glow)">
 <circle cx="300" cy="180" r="4"/>
 <circle cx="375" cy="160" r="4"/>
 <circle cx="400" cy="215" r="4"/>
 <circle cx="330" cy="255" r="4"/>
 <circle cx="360" cy="230" r="5"/>
</g>

<!-- Orbiting energy particles -->
<g filter="url(#glow)">
 <circle cx="120" cy="190" r="7" fill="#ff6685"/>
 <circle cx="550" cy="170" r="7" fill="#159e98"/>
 <circle cx="440" cy="70" r="5" fill="#c5aaff"/>
 <circle cx="220" cy="330" r="5" fill="#ff6685"/>
</g>

<!-- Glass highlights -->
<path d="M265 120 Q295 82 335 84"
 fill="none" stroke="#fff" stroke-width="5"
 stroke-linecap="round" opacity=".65"/>
<path d="M449 278 Q430 315 398 326"
 fill="none" stroke="#bca5ff" stroke-width="3"
 opacity=".5"/>

<!-- Animation -->
<circle cx="350" cy="210" r="143"
 fill="none" stroke="#ff6685" stroke-width="1"
 opacity=".5">
 <animate attributeName="r" values="140;149;140"
 dur="4s" repeatCount="indefinite"/>
</circle>

<!-- Typography -->
<g font-family="Arial" text-anchor="middle">
 <text x="350" y="400" font-size="25"
 font-weight="bold" fill="#ff9cbd"
 letter-spacing="5">ARTIFICIAL INTELLIGENCE</text>
 <text x="350" y="429" font-size="13"
 fill="#bca5ff" letter-spacing="4">NEURAL SYSTEMS · GENERATIVE AI</text>
</g>
</svg>
